<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme Fire Inventory</title>

<style>
/* -------------------- GLOBAL -------------------- */
body {
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
    margin: 0;
    padding-bottom: 120px;
}

.title {
    text-align: center;
    margin-top: 20px;
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff0000, #ff6600);
    -webkit-background-clip: text;
    color: transparent;
}

/* -------------------- INPUT SECTION -------------------- */
.input-section {
    display: flex;
    gap: 10px;
    padding: 20px;
}

input {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 2px solid #222;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
}

/* -------------------- FIRE BUTTON -------------------- */
.fire-btn {
    background: linear-gradient(90deg, #ff0000, #ff6600);
    border: none;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 50, 0, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.fire-btn:active {
    transform: scale(0.95);
    box-shadow: 0 0 10px rgba(255, 50, 0, 0.3);
}

/* -------------------- PRODUCT LIST -------------------- */
.product-list {
    padding: 20px;
}

.product-card {
    background: #000;
    border-radius: 16px;
    margin-bottom: 20px;
    padding: 15px;
    border: 10px solid;
    border-image: linear-gradient(90deg, #ff0000, #ff6600) 1;
    box-shadow: inset 0 0 25px rgba(255, 80, 0, 0.4);
    transition: transform 0.2s ease;
}

.product-card:active {
    transform: scale(0.97);
}

.product-card img {
    width: 100%;
    border-radius: 12px;
}

/* -------------------- NAV BAR -------------------- */
.nav-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: linear-gradient(90deg, #ff0000, #ff6600);
    padding: 14px 0;
    display: flex;
    justify-content: space-around;
    box-shadow: 0 -5px 20px rgba(255, 80, 0, 0.4);
    border-radius: 20px 20px 0 0;
}

.nav-item {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
}
</style>
</head>

<body>

<div class="app-container">

    <h1 class="title">Supreme Fire Inventory</h1>

    <div class="input-section">
        <input id="productLink" type="text" placeholder="Встав лінк або назву товару">
        <button id="analyzeBtn" class="fire-btn">Зробись</button>
    </div>

    <div class="product-form" style="padding: 20px;">
        <input id="productName" type="text" placeholder="Назва">
        <input id="productBrand" type="text" placeholder="Бренд">
        <input id="productSize" type="text" placeholder="Розмір">
        <input id="productSeason" type="text" placeholder="Сезон">
        <input id="productCategory" type="text" placeholder="Категорія">
        <input id="productImage" type="text" placeholder="Фото URL">

        <button id="addProductBtn" class="fire-btn" style="margin-top: 10px;">Додати</button>
    </div>

    <div id="productList" class="product-list"></div>

</div>

<div class="nav-bar">
    <div class="nav-item">Каталог</div>
    <div class="nav-item">Пошук</div>
    <div class="nav-item">Профіль</div>
</div>

<script>
/* -------------------- AUTO ANALYSIS -------------------- */
document.getElementById("analyzeBtn").addEventListener("click", async () => {
    const input = document.getElementById("productLink").value.trim();

    const data = await analyzeInput(input);

    document.getElementById("productName").value = data.name;
    document.getElementById("productBrand").value = data.brand;
    document.getElementById("productSize").value = data.size;
    document.getElementById("productSeason").value = data.season;
    document.getElementById("productCategory").value = data.category;
    document.getElementById("productImage").value = data.image;
});

/* -------------------- ADD PRODUCT -------------------- */
document.getElementById("addProductBtn").addEventListener("click", () => {
    const name = document.getElementById("productName").value;
    const brand = document.getElementById("productBrand").value;
    const size = document.getElementById("productSize").value;
    const season = document.getElementById("productSeason").value;
    const category = document.getElementById("productCategory").value;
    const image = document.getElementById("productImage").value;

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
        <img src="${image}">
        <h2>${name}</h2>
        <p>Бренд: ${brand}</p>
        <p>Розмір: ${size}</p>
        <p>Сезон: ${season}</p>
        <p>Категорія: ${category}</p>
    `;

    document.getElementById("productList").appendChild(card);
});

/* -------------------- AI LOGIC -------------------- */
async function analyzeInput(input) {
    let name = input;
    let brand = detectBrand(input);
    let size = detectSize(input);
    let category = detectCategory(input);
    let season = detectSeason(category);
    let image = "";

    return { name, brand, size, season, category, image };
}

function detectBrand(text) {
    const brands = ["Nike", "Adidas", "NB", "Zara", "H&M", "Uniqlo", "Levi", "Carhartt", "Supreme", "Off-White", "Yeezy"];
    return brands.find(b => text.toLowerCase().includes(b.toLowerCase())) || "Невідомо";
}

function detectSize(text) {
    const patterns = ["XS", "S", "M", "L", "XL", "XXL", "EU", "US", "One Size"];
    return patterns.find(p => text.toLowerCase().includes(p.toLowerCase())) || "Невідомо";
}

function detectCategory(text) {
    const map = {
        "air": "Кросівки",
        "max": "Кросівки",
        "jordan": "Кросівки",
        "t-shirt": "Футболки",
        "tee": "Футболки",
        "hoodie": "Худі",
        "jacket": "Куртки",
        "jeans": "Джинси",
        "pants": "Штани",
        "shorts": "Шорти",
        "cap": "Головні убори",
        "bag": "Сумки"
    };

    for (let key in map) {
        if (text.toLowerCase().includes(key)) return map[key];
    }

    return "Інше";
}

function detectSeason(category) {
    if (category === "Футболки" || category === "Шорти") return "Літо";
    if (category === "Худі" || category === "Світшоти") return "Осінь/Весна";
    if (category === "Куртки") return "Осінь/Зима";
    return "Універсальний";
}
</script>

</body>
</html>
